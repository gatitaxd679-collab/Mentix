<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Fondo base azul profundo espacial que combina con mentix_join_bg.jpg -->
    <radialGradient id="bgBase" cx="50%" cy="48%" r="72%">
      <stop offset="0%" stop-color="#0b2563"/>
      <stop offset="48%" stop-color="#061642"/>
      <stop offset="100%" stop-color="#020920"/>
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.24"/>
      <stop offset="45%" stop-color="#0ea5e9" stop-opacity="0.16"/>
      <stop offset="78%" stop-color="#ffe600" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020920" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>
      <stop offset="28%" stop-color="#00ff88" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffe600" stop-opacity="0.95"/>
      <stop offset="80%" stop-color="#00f5d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="neonYellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#ffe600" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#00ff88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="gridBlueGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffe600" stop-opacity="0.75"/>
    </linearGradient>

    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dotMatrix" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#00ff88" opacity="0.45"/>
      <circle cx="15" cy="15" r="1.1" fill="#ffe600" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Capa 1: Base Azul Profundo y Resplandor Central -->
  <rect width="1600" height="900" fill="url(#bgBase)"/>
  <rect width="1600" height="900" fill="url(#centerGlow)"/>

  <!-- Capa 2: Matrices de puntos cyber -->
  <rect x="340" y="210" width="220" height="150" fill="url(#dotMatrix)" opacity="0.65"/>
  <rect x="1040" y="230" width="240" height="160" fill="url(#dotMatrix)" opacity="0.65"/>
  <rect x="380" y="480" width="180" height="140" fill="url(#dotMatrix)" opacity="0.5"/>
  <rect x="1020" y="470" width="190" height="140" fill="url(#dotMatrix)" opacity="0.5"/>

  <!-- Capa 3: Líneas de perspectiva 3D (Azul eléctrico, Verde neón y Amarillo neón) -->
  <g stroke="url(#gridBlueGreen)" stroke-width="1.8" fill="none" opacity="0.72" filter="url(#glowSoft)">
    <!-- Marcos de profundidad concéntricos -->
    <rect x="170" y="70" width="1260" height="650" stroke="#00b4d8" stroke-opacity="0.55"/>
    <rect x="280" y="135" width="1040" height="515" stroke="#00ff88" stroke-opacity="0.5"/>
    <rect x="395" y="200" width="810" height="390" stroke="#ffe600" stroke-opacity="0.42"/>

    <!-- Diagonales de perspectiva desde las esquinas -->
    <line x1="0" y1="0" x2="395" y2="200" stroke="#00b4d8"/>
    <line x1="1600" y1="0" x2="1205" y2="200" stroke="#00b4d8"/>
    <line x1="0" y1="780" x2="395" y2="590" stroke="#00ff88"/>
    <line x1="1600" y1="780" x2="1205" y2="590" stroke="#00ff88"/>

    <!-- Líneas arquitectónicas laterales izquierdas -->
    <line x1="0" y1="190" x2="395" y2="310" stroke="#00ff88"/>
    <line x1="0" y1="330" x2="395" y2="395" stroke="#ffe600" stroke-opacity="0.75"/>
    <line x1="0" y1="490" x2="395" y2="485" stroke="#00b4d8"/>
    <line x1="170" y1="0" x2="170" y2="750" stroke="#00b4d8"/>
    <line x1="280" y1="40" x2="280" y2="700" stroke="#00ff88" stroke-opacity="0.65"/>

    <!-- Líneas arquitectónicas laterales derechas -->
    <line x1="1600" y1="190" x2="1205" y2="310" stroke="#00ff88"/>
    <line x1="1600" y1="330" x2="1205" y2="395" stroke="#ffe600" stroke-opacity="0.75"/>
    <line x1="1600" y1="490" x2="1205" y2="485" stroke="#00b4d8"/>
    <line x1="1430" y1="0" x2="1430" y2="750" stroke="#00b4d8"/>
    <line x1="1320" y1="40" x2="1320" y2="700" stroke="#00ff88" stroke-opacity="0.65"/>

    <!-- Líneas de techo en perspectiva -->
    <line x1="520" y1="0" x2="620" y2="200" stroke="#00ff88"/>
    <line x1="690" y1="0" x2="730" y2="200" stroke="#ffe600"/>
    <line x1="910" y1="0" x2="870" y2="200" stroke="#ffe600"/>
    <line x1="1080" y1="0" x2="980" y2="200" stroke="#00ff88"/>
    <line x1="220" y1="95" x2="1380" y2="95" stroke="#00b4d8" stroke-opacity="0.55"/>
    <line x1="330" y1="165" x2="1270" y2="165" stroke="#00ff88" stroke-opacity="0.55"/>
  </g>

  <!-- Capa 4: Figuras Geométricas Neón (Triángulos, Círculos y Cruces '+') -->
  <g filter="url(#glowStrong)" fill="none">
    <!-- Triángulos Verde Neón y Amarillo Neón -->
    <polygon points="260,175 230,228 292,222" stroke="#00ff88" stroke-width="3.2"/>
    <polygon points="455,180 435,205 468,218" stroke="#ffe600" stroke-width="2.6"/>
    <polygon points="1165,200 1125,222 1180,262" stroke="#00ff88" stroke-width="3.2"/>
    <polygon points="1455,78 1425,82 1472,126" stroke="#ffe600" stroke-width="3"/>
    <polygon points="142,545 112,605 170,590" stroke="#00ff88" stroke-width="3"/>
    <polygon points="1195,575 1135,608 1198,638" stroke="#ffe600" stroke-width="3.2"/>

    <!-- Círculos Azul Eléctrico, Verde y Amarillo -->
    <circle cx="360" cy="240" r="32" stroke="#00b4d8" stroke-width="3"/>
    <circle cx="342" cy="520" r="28" stroke="#00ff88" stroke-width="2.6"/>
    <circle cx="1285" cy="252" r="44" stroke="#00b4d8" stroke-width="3.4"/>
    <circle cx="1275" cy="482" r="35" stroke="#ffe600" stroke-width="2.8"/>
    <circle cx="1520" cy="265" r="24" stroke="#00ff88" stroke-width="3"/>

    <!-- Símbolos '+' (Plus) en Amarillo Neón y Verde Neón -->
    <g stroke="#00ff88" stroke-width="4" stroke-linecap="round">
      <path d="M535,330 v34 M518,347 h34"/>
      <path d="M590,442 v34 M573,459 h34"/>
      <path d="M775,312 v34 M758,329 h34"/>
      <path d="M975,358 v34 M958,375 h34"/>
      <path d="M725,548 v32 M709,564 h32"/>
      <path d="M1015,585 v34 M998,602 h34"/>
    </g>
    <g stroke="#ffe600" stroke-width="4" stroke-linecap="round">
      <path d="M888,402 v36 M870,420 h36"/>
      <path d="M645,408 v24 M633,420 h24"/>
      <path d="M672,468 v24 M660,480 h24"/>
      <path d="M865,500 v24 M853,512 h24"/>
      <path d="M968,458 v22 M957,469 h22"/>
      <path d="M658,662 v24 M646,674 h24"/>
      <path d="M1050,322 v20 M1040,332 h20"/>
    </g>
    <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <path d="M380,410 v22 M369,421 h22"/>
      <path d="M674,376 v22 M663,387 h22"/>
      <path d="M838,596 v20 M828,606 h20"/>
      <path d="M1398,405 v32 M1382,421 h32"/>
    </g>
  </g>

  <!-- Capa 5: Anillos 3D de Arena Central en Azul, Verde Neón y Amarillo Neón -->
  <g filter="url(#glowSoft)">
    <ellipse cx="800" cy="540" rx="640" ry="215" fill="none" stroke="#00ff88" stroke-width="2.2" stroke-opacity="0.45"/>
    <ellipse cx="800" cy="548" rx="450" ry="145" fill="none" stroke="#ffe600" stroke-width="2" stroke-opacity="0.5"/>
    <ellipse cx="800" cy="555" rx="280" ry="88" fill="#00ff88" fill-opacity="0.08" stroke="#00f5d4" stroke-width="2.5" stroke-opacity="0.7"/>
  </g>

  <!-- Capa 6: Ondas de Energía Luminosas Inferiores (Azul + Verde Neón + Amarillo Neón) -->
  <g filter="url(#glowStrong)" fill="none">
    <!-- Onda amplia de fondo azul-verde -->
    <path d="M-60,560 C220,510 380,790 680,740 C980,690 1180,580 1660,670" stroke="#00b4d8" stroke-width="18" stroke-opacity="0.35"/>
    <path d="M-60,640 C260,720 490,840 820,700 C1120,570 1360,650 1660,560" stroke="#00ff88" stroke-width="14" stroke-opacity="0.38"/>

    <!-- Líneas brillantes principales Verde Neón -->
    <path d="M-40,535 C190,520 340,765 650,760 C950,755 1130,610 1640,680" stroke="url(#neonGreenGrad)" stroke-width="5.5"/>
    <path d="M-40,605 C230,680 470,825 790,715 C1090,610 1320,515 1640,545" stroke="url(#neonGreenGrad)" stroke-width="4.5"/>

    <!-- Líneas brillantes Amarillo Neón -->
    <path d="M-40,650 C250,750 530,640 840,740 C1140,835 1350,590 1640,615" stroke="url(#neonYellowGrad)" stroke-width="4.5"/>
    <path d="M-40,720 C310,830 590,670 920,760 C1210,840 1410,675 1640,700" stroke="#ffe600" stroke-width="2.8" stroke-opacity="0.85"/>

    <!-- Filamentos finos de alta luminosidad -->
    <path d="M-40,580 C210,560 410,800 720,740 C1020,680 1240,540 1640,585" stroke="#e2fef0" stroke-width="1.8" stroke-opacity="0.8"/>
    <path d="M-40,675 C270,770 550,655 860,748 C1160,838 1370,605 1640,635" stroke="#fef9c3" stroke-width="1.6" stroke-opacity="0.85"/>
  </g>

  <!-- Capa 7: Partículas de luz neón (Amarillo y Verde) -->
  <g fill="#ffe600" filter="url(#glowSoft)">
    <circle cx="485" cy="340" r="2.5"/>
    <circle cx="615" cy="295" r="2.2"/>
    <circle cx="740" cy="410" r="2.8"/>
    <circle cx="890" cy="310" r="2.4"/>
    <circle cx="1030" cy="435" r="2.6"/>
    <circle cx="540" cy="560" r="2.2"/>
    <circle cx="940" cy="575" r="2.5"/>
  </g>
  <g fill="#00ff88" filter="url(#glowSoft)">
    <circle cx="430" cy="450" r="2.6"/>
    <circle cx="685" cy="335" r="2.4"/>
    <circle cx="825" cy="370" r="2.8"/>
    <circle cx="950" cy="285" r="2.2"/>
    <circle cx="1090" cy="380" r="2.6"/>
    <circle cx="620" cy="520" r="2.5"/>
    <circle cx="850" cy="635" r="2.5"/>
  </g>
</svg>
